name: Validate documentation kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public kit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate files, links, diagrams, and schedule assumptions
        run: python3 scripts/validate.py
